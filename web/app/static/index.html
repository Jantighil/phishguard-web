<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard - Explainable phishing detection</title>
<meta name="description" content="Check a link or e-mail for phishing and see exactly why it was classified that way.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <h1><span aria-hidden="true">&#128737;</span> PhishGuard</h1>
  <p class="tag">Check a link or e-mail for phishing - and see exactly <em>why</em>.</p>
</div></header>
<main class="wrap">
  <div class="tabs" role="tablist" aria-label="What do you want to check?">
    <button role="tab" id="tab-url" aria-selected="true" aria-controls="panel-url">Check a link</button>
    <button role="tab" id="tab-email" aria-selected="false" aria-controls="panel-email">Check an e-mail</button>
  </div>
  <section id="panel-url" role="tabpanel" aria-labelledby="tab-url" class="card">
    <form id="form-url" novalidate>
      <label for="url">Web address</label>
      <input id="url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="2048" placeholder="https://example.com/login" required>
      <label class="check hidden" id="crawl-wrap"><input type="checkbox" id="crawl"> Also fetch and inspect the page (password fields, hidden forms)</label>
      <button type="submit" class="primary">Analyse link</button>
    </form>
    <p class="hint">Nothing is opened in your browser. The link text is analysed on the server.</p>
  </section>
  <section id="panel-email" role="tabpanel" aria-labelledby="tab-email" class="card hidden">
    <form id="form-email" novalidate>
      <label for="email">Paste the e-mail (subject and body)</label>
      <textarea id="email" name="email" rows="9" maxlength="50000" placeholder="Subject: ...&#10;&#10;Dear customer, ..." required></textarea>
      <button type="submit" class="primary">Analyse e-mail</button>
    </form>
    <p class="hint">Do not paste confidential information you are not allowed to share.</p>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="result" class="hidden" aria-live="polite"></section>
</main>
<footer class="wrap foot">
  <details><summary>About this model and its limits</summary><div id="about">Loading...</div></details>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
